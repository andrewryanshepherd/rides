<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYCLING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--fg:#fff5e9;--fg2:#e6dcd1;--mut:#968d84;--dim:#4a4a4a;--line:rgba(255,255,255,.12);--panel:#141414;--gutter:clamp(20px,5vw,60px)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--fg);scroll-behavior:smooth}
body{font-size:14.62px;font-family:"Space Grotesk",sans-serif;font-weight:300;background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,select{font:inherit;color:inherit}
.caps{text-transform:uppercase;letter-spacing:.13em}
.mark{font-family:Syncopate,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:-.03em}
.mut{color:var(--mut)}

/* header */
header.top{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:26px var(--gutter);background:linear-gradient(#0c0c0c 70%,rgba(12,12,12,0))}
.plus{width:38px;height:38px;position:relative;cursor:pointer;background:none;border:0}
.plus:before,.plus:after{content:"";position:absolute;background:var(--fg);left:50%;top:50%;transform:translate(-50%,-50%)}
.plus:before{width:38px;height:1px}.plus:after{width:1px;height:38px}
.plus.open{transform:rotate(45deg)}
.plus{transition:transform .35s}
.wordmark{text-align:center;font-size:19px}
nav.menu{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;opacity:0;pointer-events:none;transition:opacity .3s}
nav.menu.open{opacity:1;pointer-events:auto}
nav.menu a{font-size:11.88px;letter-spacing:.2em;text-transform:uppercase}
nav.menu a:hover{color:var(--mut)}
.subnav{display:flex;justify-content:center;gap:clamp(14px,3vw,36px);flex-wrap:wrap;font-size:11.42px;padding:6px var(--gutter) 34px;position:sticky;top:86px;z-index:39;background:linear-gradient(#0c0c0c 55%,rgba(12,12,12,.85) 72%,rgba(12,12,12,0))}
header.top{background-color:var(--bg)!important;background-image:var(--g0)!important}
.subnav a{color:var(--mut);transition:color .2s}.subnav a:hover,.subnav a.on{color:var(--fg)}

/* sections */
section{padding:110px var(--gutter) 90px;scroll-margin-top:110px;position:relative}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.sec-title{font-size:clamp(18.27px,2.92vw,24.68px)}
.sec-kicker{font-size:11.42px;color:var(--mut)}
.mapwrap{position:relative;width:100%;background:var(--bg);border:1px solid var(--line)}
.mapwrap.analyze{cursor:pointer;transition:border-color .35s}.mapwrap.analyze::after{content:'';position:absolute;inset:0;background:#fff5e9;opacity:0;transition:opacity .35s ease;pointer-events:none}.mapwrap.analyze:hover::after,.mapwrap.analyze:focus-visible::after{opacity:.07}.mapwrap.analyze canvas.hov{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .35s ease;pointer-events:none}
.mapwrap.analyze:hover canvas.hov,.mapwrap.analyze:focus-visible canvas.hov{opacity:1}.mapwrap.analyze:hover{border-color:#d32a09}
.tlegend{display:flex;gap:18px;font-size:9.6px;letter-spacing:.14em;color:var(--fg2);margin:0 0 10px 46px}.tlegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}.tlegend em{font-style:normal;color:var(--mut);margin-left:3px}
table.parts .cb,table.parts .cm{text-align:left!important;padding-left:10px}
table.parts td.ct{text-align:left;font-size:10.51px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2)}
table.parts .pcatv{width:30px!important;padding:0 10px 0 0!important;position:relative;border-bottom:none!important}
table.parts td.pcatv div{position:absolute;top:3px;bottom:3px;left:0;right:10px;background:#ebdec6;color:#0c0c0c;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:8px;overflow:hidden;white-space:nowrap}
table.parts td.pcatv b{font-family:Syncopate,sans-serif;font-weight:700;font-size:9.6px;letter-spacing:.02em;text-transform:uppercase}
table.parts td.pcatv span{font-size:8.69px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
table.parts tr.gstart td{border-top:34px solid transparent;background-clip:padding-box}
table.parts tbody tr.gstart:first-child td{border-top-width:6px}
table.parts th.ct{text-align:left}
table.parts .pnum::after{content:'g'}
table.parts td.svc2,table.parts .svc.svc2{color:#CF8044!important;font-weight:600}table.parts td.svc1,table.parts .svc.svc1{color:rgba(207,128,68,.65)!important}table.parts .svc.svc0{color:var(--mut)}table.parts tr.due td,table.parts tr.due td span,table.parts tr.due td.ct{color:#CF8044!important}table.parts a.buy{text-decoration:underline;text-underline-offset:3px}table.parts .svc{font-size:9.14px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
table.parts tr.pwhat td{color:#CF8044;border-bottom:none}table.parts tr.pwhatt td{border-top:1px solid rgba(207,128,68,.5);font-weight:600}table.parts tr.pwhat td.ct{color:#CF8044}table.parts tr.pwhat td .mut{color:rgba(207,128,68,.7)}
table.parts tr.psubt td{border-top:1px solid var(--fg);border-bottom:none;font-weight:600;color:var(--fg)}table.parts tr.psubt td.ct{color:var(--fg)}
table.parts thead th,table.parts thead th.cmat,table.parts thead th.csz{background:#ebdec6;color:#0c0c0c;font-weight:700;padding-top:2px;padding-bottom:0;height:36px;line-height:1;vertical-align:middle;border-bottom:none}
table.parts thead th.pcatv{background:transparent}
table.parts .pnote{display:block;font-style:normal;font-size:10.05px;color:var(--mut);margin-top:3px}
table.parts tr.psub td{font-size:11.42px;color:var(--fg2);border-top:none}
table.parts tr.psub td.ct{padding-left:26px;color:var(--mut)}
table.parts tr.psub td.ct::before{content:'↳ ';opacity:.6}
.mini6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:12px}@media(max-width:900px){.mini6{grid-template-columns:repeat(3,1fr)}}
.mini{position:relative;aspect-ratio:1/1;background-color:var(--panel);background-image:var(--g1);background-attachment:fixed;background-size:var(--gs,256px) var(--gs,256px);border:1px solid var(--line);cursor:pointer;transition:border-color .35s}
.mini canvas{position:absolute;inset:0;width:100%;height:100%}.mini::after{content:'';position:absolute;inset:0;background:#fff5e9;opacity:0;transition:opacity .35s;pointer-events:none}.mini:hover::after{opacity:.07}.mini:hover{border-color:var(--fg)}
.mini .mmi{position:absolute;left:12px;bottom:10px;text-shadow:0 0 6px #141414,0 0 12px #141414;font-size:20.11px;font-weight:300;letter-spacing:-.01em;pointer-events:none}.mini .mmi small{font-size:9.14px;letter-spacing:.14em;margin-left:4px;color:var(--fg2)}
.mini.mall .mgrid{position:absolute;left:14px;right:14px;top:40px;bottom:46px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;opacity:.85;transition:opacity .35s;pointer-events:none}.mini.mall .mgrid canvas{position:static;width:100%;height:100%;border:1px solid rgba(235,222,198,.08)}.mini.mall:hover .mgrid{opacity:.95}.mini.mall span,.mini.mall b{position:relative;z-index:1}
.mini.mall{display:flex;flex-direction:column;justify-content:space-between;padding:14px 14px 12px;text-decoration:none;color:var(--fg);font-size:10.51px;letter-spacing:.18em}.mini.mall b{font-weight:300;font-size:23.77px;align-self:flex-end;transition:transform .35s}.mini.mall:hover b{transform:translateX(5px)}
.mini .rtype{font-size:8.69px;padding:5px 8px 4px}
.mapwrap .rtype,.mini .rtype{position:absolute;top:0;left:0;background:var(--fg);color:#0c0c0c;font-weight:500;letter-spacing:.16em;pointer-events:none}
.mapwrap .rtype{position:absolute;top:0;left:0;background:var(--fg);color:#0c0c0c;font-size:9.6px;font-weight:500;letter-spacing:.16em;padding:6px 10px 5px;pointer-events:none}
.mapwrap.analyze .ana{position:absolute;top:16px;right:20px;font-size:10.51px;letter-spacing:.2em;color:var(--fg);transition:color .35s;pointer-events:none}.mapwrap.analyze .ana span{display:inline-block;margin-left:6px;transition:transform .35s}
.mapwrap.analyze:hover .ana{color:#d32a09}.mapwrap.analyze:hover .ana span{transform:translateX(4px)}
.mapwrap canvas{display:block;width:100%;height:100%}
.maplabel{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:18px 22px;pointer-events:none;gap:12px}
.big{font-size:clamp(31.08px,5.94vw,69.46px);font-weight:300;line-height:.9;letter-spacing:-.02em}
.big small{font-size:.32em;letter-spacing:.13em;margin-left:.35em;color:var(--fg2)}
.biglbl{font-size:10.51px;color:var(--mut);margin-top:8px}
.r{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border-left:1px solid var(--line)}
.kpis.full6{grid-template-columns:repeat(6,1fr)}@media(max-width:900px){.kpis.full6{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.kpis.full6{grid-template-columns:repeat(2,1fr)}}
.kpis.g9{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.kpi{background:var(--bg);padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi .v{font-size:21.94px;font-weight:300}.kpi .v small{font-size:10.96px;color:var(--mut);margin-left:4px;letter-spacing:.1em}
.kpi .l{font-size:10.05px;color:var(--mut);margin-top:6px}
.kpi.click{cursor:pointer}.kpi.click:hover{background:#0d0d0d}
.delta{font-size:10.96px;margin-left:8px;color:var(--fg2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:28px;margin-top:34px}
.chart{position:relative}
.grid2.padded{gap:56px 64px;margin-top:56px}.grid2.padded .chart{padding:8px 10px}.grid2.padded .chart>h4,.grid2.padded .chart>.legend,.grid2.padded .chart>.caps,.grid2.padded .chart>.top3{padding-left:46px}
.top3.hi b{border-color:#cf8044;color:#cf8044}.top3.hi b.f{background:#cf8044;color:#000}
.chart h4{font-weight:400;font-size:10.96px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:12px}
.chart p.note{font-size:10.96px;color:var(--mut);margin-bottom:10px;max-width:60ch}
.chart svg{display:block;width:100%;overflow:visible}
.chart svg[width="22"]{display:inline-block;width:22px}
.axis text{fill:var(--mut);font-size:9.6px;font-family:"Space Grotesk";letter-spacing:.06em}
.axis line,.axis path{stroke:var(--line)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}
.ctrl select,.ctrl button{background:var(--bg);border:1px solid var(--dim);padding:8px 12px;font-size:10.96px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:0}
.ctrl button.on{background:var(--fg);color:#000;border-color:var(--fg)}
.ctrl select:focus,.ctrl button:focus-visible{outline:1px solid var(--fg)}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--bg);border:1px solid var(--fg);padding:9px 11px;font-size:10.96px;line-height:1.5;letter-spacing:.04em;opacity:0;transition:opacity .1s;max-width:240px}
.tip b{font-weight:500}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.cards.two{grid-template-columns:1fr 1fr}
.card{cursor:pointer;background:#141414;border:1px solid var(--line);transition:border-color .2s}
.card{position:relative}.card::after{content:'';position:absolute;inset:0;background:#fff5e9;opacity:0;transition:opacity .35s ease;pointer-events:none}
.card:hover::after,.card:focus-visible::after{opacity:.07}.card:hover{border-color:var(--fg)}
.card canvas{display:block;width:100%;aspect-ratio:1/1}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px 4px;gap:8px}
.card .mi{font-size:19.19px}.card .mi small,.card .np small{font-size:9.14px;color:var(--mut);letter-spacing:.12em;margin-left:3px}
.card .np{font-size:13.7px}
.card .ex{font-size:10.05px;color:var(--fg2);padding:0 12px 4px;letter-spacing:.08em}
.card .dt{font-size:9.6px;color:var(--mut);padding:0 12px 11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{display:block;margin:26px auto 0;background:none;border:1px solid var(--fg);padding:12px 28px;font-size:10.96px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.more:hover{background:var(--fg);color:#000}

/* records */
.recs .card .dt{white-space:normal}
.cards.five{grid-template-columns:repeat(5,1fr)}@media(max-width:1000px){.cards.five{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.cards.five{grid-template-columns:repeat(2,1fr)}}
.ytop-h{font-size:10.96px;letter-spacing:.13em;margin:34px 0 14px}
.kpis.full3{grid-template-columns:repeat(3,1fr)}
.pmed{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:9.6px;font-weight:600;margin-right:10px;vertical-align:middle;letter-spacing:0;box-sizing:border-box}
.kpi .pmed{width:24px;height:24px;font-size:10.96px;margin-right:12px;position:relative;top:-3px}
.pmed.p1{background:#cf8044;color:#0c0c0c}.pmed.p2{background:#ebdec6;color:#0c0c0c}.pmed.p3{background:transparent;color:#d32a09;border:1.5px solid #d32a09}
table.pod td a{color:var(--fg);text-decoration:none;border-bottom:1px solid transparent}table.pod td a:hover{border-bottom-color:var(--fg)}table.pod td:first-child{width:36px}table.pod td:nth-child(2),table.pod th:nth-child(2){text-align:left}
.rec-g{font-weight:400;font-size:10.96px;letter-spacing:.13em;margin:56px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--line)}.sec-head+.rec-g{margin-top:12px}
.rec-l{font-size:9.6px;letter-spacing:.14em;text-transform:uppercase;padding:12px 12px 0;color:var(--fg2)}

/* detail */
#detail{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .25s}
#detail.open{opacity:1;pointer-events:auto}
.dtop{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px var(--gutter);background:linear-gradient(#0c0c0c 75%,rgba(12,12,12,0))}
.dtop .x{justify-self:end}
.dnav{display:flex;gap:18px;font-size:10.96px}
.dnav button{background:none;border:0;cursor:pointer;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.dnav button:hover{color:var(--fg)}
.dbody{padding:0 var(--gutter) 70px}
.dtitle{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin:6px 0 18px}
.dtitle h2{font-size:clamp(16.45px,2.38vw,21.94px)}
.readout{position:absolute;top:16px;left:20px;font-size:10.96px;line-height:1.7;letter-spacing:.08em;pointer-events:none;color:var(--fg2)}
.stack .chart{margin-top:22px}
.ctx{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);margin-top:30px}
.ctx div{background:var(--bg);padding:14px 16px;font-size:11.42px;line-height:1.55;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ctx b{font-weight:400;font-size:18.27px;display:block}
.cmpmaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.cmpmaps .yr{position:absolute;top:16px;left:20px;font-size:clamp(20.11px,3.1vw,31.08px);pointer-events:none}
table.cmp{width:100%;border-collapse:collapse;margin-top:28px;font-size:12.79px}
table.cmp th{font-weight:400;font-size:10.05px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);text-align:right;padding:10px 12px;border-bottom:1px solid var(--fg)}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.cmp td:first-child{font-size:10.51px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2)}
table.cmp td.up{color:var(--fg)}table.cmp td.dn{color:var(--mut)}
table.cmp tr.click{cursor:pointer}table.cmp tr.click:hover td{background:#0d0d0d}
.legend{display:flex;gap:20px;font-size:10.05px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg2);margin:0 0 8px}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid #ebdec6;vertical-align:middle;margin-right:7px}
.legend i.b{border-top:1.5px dashed rgba(235,222,198,.6)}
.legend i.bar{height:10px;width:10px;border:0;background:#ebdec6;border-radius:2px}.legend i.bar.b{background:rgba(235,222,198,.4)}
.legend i.s1{border-top:1.5px dashed rgba(235,222,198,.6)}.legend i.s2{border-top:1.5px dotted rgba(235,222,198,.32)}.legend i.bar.s0{background:rgba(235,222,198,.9)}.legend i.bar.s1{background:rgba(235,222,198,.5);border:0}.legend i.bar.s2{background:rgba(235,222,198,.22);border:0}
.cmpmaps.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.cmpmaps.three .big{font-size:clamp(25.59px,2.65vw,42.04px)}.cmpmaps.three .maplabel{padding:14px 16px}
table.cmp .chg{display:block;font-size:9.6px;letter-spacing:.06em;margin-top:3px}table.cmp .chg.up{color:var(--fg)}table.cmp .chg.dn{color:var(--mut)}
.note{font-size:10.96px;color:var(--mut);margin-top:10px;max-width:80ch;line-height:1.5}
.calmonths{margin-top:30px;display:grid;gap:26px}
.calm-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--fg);padding-bottom:8px;margin-bottom:4px}.calm-h .mark{font-size:14.62px}.calm-h .caps{font-size:10.05px}
.calm-r{display:grid;grid-template-columns:34px 150px 140px 1fr 80px;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:11.88px;align-items:baseline}.calm-r .caps{font-size:10.05px}.calm-r .r{text-align:right;color:var(--fg2)}
@media (max-width:640px){.calm-r{grid-template-columns:28px 1fr 64px}.calm-r>span:nth-child(3){display:none}.calm-r>span:nth-child(4){grid-column:2/3}.calm-r>span:nth-child(2){grid-column:2/4}}
.wchg div{display:grid;grid-template-columns:110px 110px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:11.42px;align-items:baseline}.wchg .mark{font-size:16.45px}.wchg .caps{font-size:9.6px}
#bikesview{min-height:60vh}
table.cmp tr.gap td{padding:0;height:26px;border-bottom:none}
table.cmp tr.sep td{padding:0;height:36px;border-bottom:1px solid var(--line)}
.inactive-div{height:90px}
.pin{background:transparent;border:0;border-bottom:1px solid #333;color:var(--fg);font:inherit;font-size:11.88px;width:100%;padding:5px 2px;letter-spacing:.02em;text-transform:none;color-scheme:dark}
.pin:focus{outline:0;border-bottom-color:var(--fg)}.pin.num{width:80px;text-align:right}.pin:disabled{border-bottom-color:transparent;color:var(--fg2)}
table.parts td{vertical-align:middle;padding:0 10px;height:52px;box-sizing:border-box;white-space:nowrap}table.parts td.cb{width:14%}table.parts td.cm{width:24%}table.parts td.ct{white-space:nowrap}table.parts .cmat,table.parts .csz{text-align:left!important;color:var(--fg2);width:10%}table.parts td.csz{white-space:nowrap}table.parts th{white-space:nowrap}
table.parts .acts{white-space:nowrap;text-align:right}table.parts .acts button,.addp{background:none;border:1px solid #333;color:var(--fg2);font:inherit;font-size:9.6px;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;cursor:pointer;margin-left:6px}
table.parts .acts button:hover,.addp:hover{border-color:var(--fg);color:var(--fg)}.addp{margin:8px 0 0}
.parts-head{display:flex;gap:clamp(30px,6vw,90px);flex-wrap:wrap;padding:26px 0 22px;border-top:1px solid var(--fg);border-bottom:1px solid var(--line)}

    const t=lb.lastChild;t.textContent=`${fmt(ys[i],o.d||0)} ${o.u}`;lb.style.display='';const tw=t.getComputedTextLength()+16;const rc=lb.firstChild;rc.setAttribute('width',tw);t.setAttribute('x',8);const lx=x+10+tw>w-m.r?x-10-tw:x+10;const ly=Math.max(m.t,Math.min(H-m.b-22,Y(ys[i])-24));lb.setAttribute('transform',`translate(${lx},${ly})`)}else{cross.lastChild.style.display='none';lb.style.display='none'}}}
function tqCad(box,pts,ftp){const H=260,m={l:46,r:16,t:12,b:30};const {s,w}=svg(box,H);const cx=pts.map(p=>p[0]),ty=pts.map(p=>p[1]);
  const NX=nice(Math.max(30,Math.min(...cx)-5),Math.max(...cx)+5,5),NY=nice(0,Math.max(...ty)*1.05,4);const X=v=>m.l+(v-NX.lo)/(NX.hi-NX.lo)*(w-m.l-m.r),Y=v=>m.t+(1-v/NY.hi)*(H-m.t-m.b);
  const g=document.createElementNS(NS,'g');s.appendChild(g);yAxis(g,Y,NY.t,w,m,0);NX.t.forEach(t=>g.insertAdjacentHTML('beforeend',`<g class="axis"><text x="${X(t)}" y="${H-m.b+16}" text-anchor="middle">${t}${t===NX.t[NX.t.length-1]?' rpm':''}</text></g>`));
  g.insertAdjacentHTML('beforeend',`<text x="${m.l+4}" y="${m.t+8}" fill="#8c8c8c" font-size="9.6" letter-spacing=".1em">N·M</text>`);
  let d='';pts.forEach(p=>d+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.3"/>`);g.insertAdjacentHTML('beforeend',`<g fill="#ebdec6" fill-opacity=".45">${d}</g>`);
  if(ftp){let c='';for(let v=NX.lo;v<=NX.hi;v+=1){const t=ftp/(v*Math.PI/30);if(t<=NY.hi)c+=(c?'L':'M')+X(v).toFixed(1)+','+Y(t).toFixed(1)}g.insertAdjacentHTML('beforeend',`<path d="${c}" fill="none" stroke="#ebdec6" stroke-width="1.5" stroke-dasharray="4 4"/>`);
    let lx=NX.lo;while(ftp/(lx*Math.PI/30)>NY.hi*.92&&lx<NX.hi)lx++;const lt=ftp/(lx*Math.PI/30);if(lt<=NY.hi)g.insertAdjacentHTML('beforeend',`<text x="${X(lx)+8}" y="${Y(lt)+4}" text-anchor="start" fill="#fff5e9" font-size="9.6" letter-spacing=".1em">FTP ${ftp} W</text>`)}
  const sw=pts.reduce((a,p)=>a+p[2],0)||1,mc=pts.reduce((a,p)=>a+p[0]*p[2],0)/sw,mt=pts.reduce((a,p)=>a+p[1]*p[2],0)/sw;
  g.insertAdjacentHTML('beforeend',`<circle cx="${X(mc)}" cy="${Y(mt)}" r="6" fill="#0c0c0c" stroke="#ebdec6" stroke-width="2"/><text x="${Math.min(X(mc)+10,w-190)}" y="${Y(mt)-10}" fill="#fff5e9" stroke="#0c0c0c" stroke-width="4" paint-order="stroke" font-size="9.6" letter-spacing=".1em">AVG ${fmt(mc)} RPM · ${fmt(mt,1)} N·M</text>`)}
function hbars(box,data,u,o={}){const rowH=o.zones?42:24,m={l:120,r:96,t:4,b:4};const H=data.length*rowH+m.t+m.b;const {s,w}=svg(box,H);const mx=Math.max(...data.map(d=>d.y),1);const tot=data.reduce((a,d)=>a+d.y,0)||1;
  data.forEach((d,i)=>{const y=m.t+i*rowH,bw=(w-m.l-m.r)*d.y/mx;const op=.35+.65*(i/(data.length-1||1));const r=Math.min(4,bw/2);const zc=o.zones?zoneCol(i/(data.length-1||1)):null;const gid='zg'+Math.random().toString(36).slice(2,8);
    s.insertAdjacentHTML('beforeend',`<text x="${m.l-10}" y="${y+rowH/2+4}" text-anchor="end" fill="#dcdcdc" font-size="10.05" letter-spacing=".06em">${esc(d.x)}</text>`+(bw>0.5?`<path d="M${m.l},${y+3}H${m.l+bw-r}Q${m.l+bw},${y+3} ${m.l+bw},${y+3+r}V${y+rowH-5-r}Q${m.l+bw},${y+rowH-5} ${m.l+bw-r},${y+rowH-5}H${m.l}Z" fill="${zc||'#ebdec6'}" fill-opacity="${zc?1:op}"/>`:'')+`<text x="${m.l+bw+8}" y="${y+rowH/2+4}" fill="#fafafa" font-size="10.05">${fmt(d.y)} ${u} <tspan fill="#8c8c8c">${fmt(d.y/tot*100)}%</tspan></text>`)})}
function curveCmp(box,labels,a,b){const H=220,m={l:46,r:16,t:12,b:28};const {s,w}=svg(box,H);const N=nice(0,Math.max(...a.filter(Boolean),...b));const X=i=>m.l+i/(labels.length-1)*(w-m.l-m.r),Y=v=>m.t+(1-v/N.hi)*(H-m.t-m.b);
  const g=document.createElementNS(NS,'g');s.appendChild(g);yAxis(g,Y,N.t,w,m,0);labels.forEach((l,i)=>g.insertAdjacentHTML('beforeend',`<g class="axis"><text x="${X(i)}" y="${H-m.b+18}" text-anchor="middle">${l}</text></g>`));
  const path=(v,ex)=>{const p=v.map((y,i)=>y?[X(i),Y(y)]:null).filter(Boolean);return `<path d="${p.map((q,i)=>(i?'L':'M')+q.join(',')).join('')}" fill="none" ${ex}/>`};
  g.insertAdjacentHTML('beforeend',path(b,'stroke="#ebdec6" stroke-width="1.2" stroke-dasharray="3 4" stroke-opacity=".6"')+path(a,'stroke="#cf8044" stroke-width="2.5"'));
  a.forEach((v,i)=>{if(!v)return;const c=document.createElementNS(NS,'circle');Object.entries({cx:X(i),cy:Y(v),r:4.5,fill:v>=b[i]?'#cf8044':'#0c0c0c',stroke:'#cf8044','stroke-width':1.5}).forEach(([k,x])=>c.setAttribute(k,x));c.onmousemove=ev=>showTip(`<b>${v} W</b> · ${labels[i]}<br><span class="mut">Best to date ${b[i]} W · ${fmt(v/b[i]*100)}%</span>`,ev.clientX,ev.clientY);c.onmouseleave=hideTip;g.appendChild(c)})}
